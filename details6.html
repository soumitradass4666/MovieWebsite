<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Movie Six - MovieHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#0b0b0f;color:white}
nav{background:#111118;padding:18px 6%;display:flex;justify-content:space-between}nav a{color:white;text-decoration:none;margin-left:15px}
main{width:90%;max-width:1000px;margin:50px auto}.box{background:#15151c;padding:30px;border-radius:15px;display:grid;grid-template-columns:300px 1fr;gap:40px}
img{width:100%;border-radius:10px}h1{font-size:38px;margin-bottom:15px}p{color:#ccc;line-height:1.7;margin:15px 0}.rating{color:#ffd700}
button,a.btn{background:#e50914;color:white;border:0;padding:12px 18px;border-radius:7px;text-decoration:none;cursor:pointer}.back{background:#292932!important}
.modal{display:none;position:fixed;inset:0;background:#000e;align-items:center;justify-content:center}.modal div{width:90%;max-width:850px;position:relative}video{width:100%;background:#000}
.close{position:absolute;right:0;bottom:-45px}.full{position:absolute;left:0;bottom:-45px;background:#292932!important}footer{text-align:center;padding:30px;color:#888}
@media(max-width:700px){.box{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<nav><b>🎬 Movie<span style="color:#e50914">Hub</span></b><div><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav>
<main><div class="box">
<img src="https://picsum.photos/600/800?random=6">
<div><h1>Movie Six</h1><p>🎭 Genre: Sci-Fi</p><p>📅 Release Year: 2025</p><p class="rating">⭐ 8.6/10</p><p>A fictional sci-fi movie with futuristic characters and an exciting story.</p><button onclick="openTrailer()">▶ Watch Trailer</button> <a class="btn back" href="index.html">← Back</a></div>
</div></main>
<div class="modal" id="modal"><div><video id="video" controls playsinline><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video><button class="full" onclick="full()">⛶ Full Screen</button><button class="close" onclick="closeTrailer()">✕ Close</button></div></div>
<footer>© 2025 MovieHub</footer>
<script>
let m=document.getElementById("modal"),v=document.getElementById("video");
function openTrailer(){m.style.display="flex";v.play()}function closeTrailer(){v.pause();m.style.display="none"}function full(){v.requestFullscreen()}
</script>
</body>
</html>
